# SonarQube Cloud configuration for C3L.
# The project key and organization must match the identifiers shown in SonarQube Cloud exactly.
sonar.projectKey=Diffie-Hellman25519_C3L
sonar.organization=diffie-hellman25519

# Production code. Dev tooling lives in scripts/.
sonar.sources=src,scripts

# Only the top-level tests/ folder is a test root. Colocated *.test.ts files are excluded from
# source analysis below: Sonar does not split them out when src/ is both a source and a test root.
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts

# Generated output, vendored packages, docs, CI configuration and colocated tests are not
# application code. tests/ stays in the test scope; test files still produce coverage for src/.
sonar.exclusions=src/**/*.test.ts,**/node_modules/**,**/coverage/**,**/.tmp-*/**,.github/**,**/*.md,**/*.json,**/*.yml,**/*.yaml

# Coverage report produced by `bun test --coverage --coverage-reporter=lcov`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Lets the TypeScript analyzer resolve the project's tsconfig settings.
sonar.typescript.tsconfigPaths=tsconfig.json

# Excluded from coverage only: the server entry point starts a real listener, and scripts/
# is developer tooling. Both are still analyzed for issues.
sonar.coverage.exclusions=src/index.ts,scripts/**

sonar.sourceEncoding=UTF-8
